# Camera bring-up session. Two v4l2loopback nodes (rear/front), not the
# Ultra sibling's four -- this device has no ultrawide rear or dual front.
# video_nr 20/21 chosen to stay clear of any UVC webcam a USB dock might
# add at boot (those enumerate from video0).
options v4l2loopback devices=2 video_nr=20,21 card_label=X716B-Rear,X716B-Front exclusive_caps=1,1 max_buffers=4 max_openers=16
