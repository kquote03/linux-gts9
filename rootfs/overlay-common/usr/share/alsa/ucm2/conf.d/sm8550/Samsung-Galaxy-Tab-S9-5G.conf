# UCM profile for the Galaxy Tab S9 5G (SM-X716B).
#
# Copied from gts9wifi-fedora's own Samsung-Galaxy-Tab-S9.conf (X710) --
# named to match *this* board's real ALSA card longname
# ("Samsung-Galaxy-Tab-S9-5G", set by this board's own DTS `model`
# property) instead, since UCM2's conf.d matching is by that exact
# filename and the X710-named file never matched this card. Shares the
# same Qualcomm/sm8550/GTS9/HiFi.conf -- the hardware (4x CS35L45 on
# PRIMARY MI2S, DMICs into the LPASS VA macro) is identical between the
# two boards' audio subsystems.
#
# Unlike the SM8550 reference boards this tablet has no WSA/WCD codecs: the four
# Cirrus CS35L45 amplifiers hang off PRIMARY MI2S and the microphones are DMICs
# straight into the LPASS VA macro.  The routing therefore has nothing in common
# with the HDK profile and is spelled out here.

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8550/GTS9/HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	# The AudioReach topology's own DAPM mixer route: without this the
	# card probes fine but every stream fails with "no backend DAIs
	# enabled for MultiMedia1 Playback" -- confirmed live on hardware,
	# not present in gts9wifi-fedora's own BootSequence (X710 was
	# presumably ordering this some other way -- this port hasn't
	# investigated why theirs doesn't need it explicitly here).
	cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' on"
	# Each amp's physical AMP Enable Switch. Also confirmed necessary
	# live: the card instantiates and streams without these, but no
	# sound reaches the speakers until all four are on.
	cset "name='Front Left AMP Enable Switch' on"
	cset "name='Front Right AMP Enable Switch' on"
	cset "name='Rear Left AMP Enable Switch' on"
	cset "name='Rear Right AMP Enable Switch' on"
	# Per-amplifier hardware volume.  457 is 0 dB; 380 is about -19 dB, the
	# level verified safe on hardware while still loud enough for the tablet
	# to be used comfortably.  The Cirrus DSP speaker-protection firmware is
	# not loaded on this port, so nothing limits excursion in hardware -
	# upstream's own SM8550 machine driver caps its speakers for exactly
	# this reason.  Raise this only together with working speaker
	# protection.
	cset "name='Front Left Digital PCM Volume' 380"
	cset "name='Front Right Digital PCM Volume' 380"
	cset "name='Rear Left Digital PCM Volume' 380"
	cset "name='Rear Right Digital PCM Volume' 380"
	cset "name='Front Left Analog PCM Volume' 3"
	cset "name='Front Right Analog PCM Volume' 3"
	cset "name='Rear Left Analog PCM Volume' 3"
	cset "name='Rear Right Analog PCM Volume' 3"
	# Each amp's DAC pulls from one of the two TDM/I2S RX slots on the
	# shared MI2S bus -- ASP_RX1 = left, ASP_RX2 = right. gts9wifi-fedora's
	# own BootSequence (copied here verbatim at first) sets every amp to
	# ASP_RX1: on X716B that put all four speakers on the left channel
	# only, with the right channel never audible from any speaker (real
	# bug, confirmed live on hardware -- switching the two Right amps to
	# ASP_RX2 fixed it, confirmed audibly: alternating L/R test tones now
	# genuinely alternate). Left unclear whether X710 has this same bug
	# uninvestigated in their own reference config, or their hardware
	# differs some other way -- not this port's concern to resolve.
	cset "name='Front Left DACPCM Source' ASP_RX1"
	cset "name='Front Right DACPCM Source' ASP_RX2"
	cset "name='Rear Left DACPCM Source' ASP_RX1"
	cset "name='Rear Right DACPCM Source' ASP_RX2"
]

Include.card-init.File "/lib/card-init.conf"
