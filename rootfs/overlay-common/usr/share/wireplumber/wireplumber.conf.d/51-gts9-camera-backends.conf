# WirePlumber 0.5 reads SPA-JSON rules; main.lua.d was a 0.4 interface.
# Location survives changes to the front sensor's unverified CCI path.
monitor.libcamera.rules = [
  {
    matches = [ { api.libcamera.location = "back" node.name = "~libcamera_input.*" } ]
    actions = { update-props = {
      media.class = "Video/Source"
      node.name = "gts9-camera-rear"
      node.description = "X716B Rear"
    } }
  }
  {
    matches = [ { api.libcamera.location = "front" node.name = "~libcamera_input.*" } ]
    actions = { update-props = {
      media.class = "Video/Source"
      node.name = "gts9-camera-front"
      node.description = "X716B Front"
    } }
  }
]
