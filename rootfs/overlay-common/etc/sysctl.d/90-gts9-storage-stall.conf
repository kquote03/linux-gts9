# The rootfs lives on a microSD card (SDR104). A big fsync-heavy write burst
# (flatpak/ostree commit) can stall it for tens of seconds. Keep the dirty
# backlog small so each stall is short, and never let a blocked-task report
# panic the kernel: a >15 s I/O wait used to hit hung_task_panic=1 and reboot
# the tablet ~10 s later via panic=10 (see docs/porting-log.md Session 22).
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 67108864
kernel.hung_task_panic = 0
kernel.hung_task_timeout_secs = 120
# ABL injects nowatchdog, which turns the lockup detectors off; re-enable them.
kernel.watchdog = 1
kernel.softlockup_panic = 1
