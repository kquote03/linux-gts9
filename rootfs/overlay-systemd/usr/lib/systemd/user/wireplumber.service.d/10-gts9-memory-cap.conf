# WirePlumber hosts the libcamera SPA plugin (and with it libcamera and the CPU
# software ISP) in-process. An earlier plugin build leaked WirePlumber to
# 5.4 GB and got it OOM-killed; the current build is flat at ~60-80 MB idle and
# streaming, so these limits are pure protection: if anything regresses it is
# throttled and then restarted instead of taking the whole 6 GB tablet down.
# See docs/porting-log.md Session 24.
[Service]
MemoryHigh=900M
MemoryMax=1500M
