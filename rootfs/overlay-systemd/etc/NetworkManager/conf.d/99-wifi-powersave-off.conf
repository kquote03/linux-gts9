# WiFi throughput bring-up session: real-hardware report of severe WiFi
# throughput regression (400-600 Mbps on stock Android -> 500 Kbps-8 Mbps
# here, same tablet, same network). Confirmed live: mac80211's own
# kernel-level default is power-save ON for every wiphy
# (net/wireless/core.c's wiphy_register() unconditionally sets
# WIPHY_FLAG_PS_ON_BY_DEFAULT -- standard upstream behavior, not a bug in
# this port's kernel/driver). Turning it off dropped ping RTT from 43ms
# to 3-7ms instantly -- a classic symptom of power-save fighting a
# sustained transfer without transfer-aware tuning.
#
# This Fedora rootfs runs NetworkManager, which actively manages and
# re-asserts its own power-save policy on every connection/reconnection
# -- confirmed live that rootfs/overlay-common's
# usr/lib/udev/rules.d/72-gts9wifi-wifi-powersave-off.rules (a one-shot
# fix at interface-creation time, kept for non-NetworkManager rootfs
# variants) gets silently overridden by NetworkManager shortly after
# boot. This is the real, persistent fix for any NetworkManager-managed
# deployment: wifi.powersave = 2 means "disable" (NM's own enum: 0 =
# use driver default, 1 = ignore/don't touch, 2 = disable, 3 = enable).
# See docs/porting-log.md's WiFi throughput bring-up session entry for
# real-hardware verification (confirmed "Power save: off" surviving a
# full NetworkManager restart/reconnect).
[connection]
wifi.powersave = 2
