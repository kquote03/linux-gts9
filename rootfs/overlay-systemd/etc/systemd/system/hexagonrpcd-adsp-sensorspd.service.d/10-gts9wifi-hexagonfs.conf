[Unit]
Requires=gts9wifi-adsp-boot.service
After=gts9wifi-adsp-boot.service pd-mapper.service
# suspend.target is reached AFTER the kernel returns. Stop the bridge before
# sleep.target instead, so it cannot issue FastRPC calls during suspend.
Conflicts=
Conflicts=sleep.target
Before=
Before=sleep.target

[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -s -R /usr/share/qcom/sm8550/Samsung/gts9-5g
# A failed sensor-PD attach can SSR the shared ADSP. Do not enter an automatic
# crash loop: one controlled attempt per boot is enough, and audio can recover.
Restart=no
