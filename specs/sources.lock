# Pinned upstream sources for every component this project builds from source
# and patches. Single source of truth: sourced by scripts/lib/downstream.sh
# (and therefore by scripts/build-downstream-userland.sh, the Fedora/Debian
# rootfs builders, scripts/build-mainline-kernel.sh and
# scripts/test-downstream-patches.sh). Keep in sync with nixos/packages/*.nix
# (Nix pins by content hash instead) -- see docs/downstream-patches.md.
#
# Sources are pinned by full git commit, never by tag or tarball hash: a
# commit id survives forge archive-compression changes and moved tags, and
# the fetch helper refuses to continue if the checkout is anywhere else.
#
# NAME_URL     git remote
# NAME_COMMIT  full 40-hex commit (verified after checkout)
# NAME_TAG     informational only (the release the commit corresponds to)
# NAME_SERIES  directory under specs/ holding the `series` patch list

